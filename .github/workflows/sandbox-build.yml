name: Sandbox build

# Every push to main (i.e. every merged PR) builds an internal-distribution
# Android APK against the sandbox backend (see eas.json's `preview`
# profile), so the team always has a current build to install and try out.
# iOS isn't built here — ad hoc iOS credentials aren't set up for this
# profile; add an `ios` step back once that's needed.
# The finished build's install link is published to a rolling
# "sandbox-latest" GitHub Release rather than left in the Actions log.
on:
  push:
    branches:
      - main

concurrency:
  group: sandbox-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build android (preview profile, sandbox backend)
        env:
          SHA: ${{ github.sha }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --message "$SHA" \
            --json > build.json

      - name: Recreate the rolling "sandbox-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          id=$(jq -r '.[0].id' build.json)
          owner=$(jq -r '.expo.owner' app.json)
          slug=$(jq -r '.expo.slug' app.json)
          link="https://expo.dev/accounts/$owner/projects/$slug/builds/$id"
          notes="Sandbox build for $SHA, built $(date -u +'%Y-%m-%d %H:%M UTC').

          Install link:

          - **android**: $link"
          gh release delete sandbox-latest --repo "$REPOSITORY" --yes --cleanup-tag || true
          gh release create sandbox-latest --repo "$REPOSITORY" \
            --title "Sandbox (latest)" --notes "$notes" --prerelease \
            --target "$SHA"
