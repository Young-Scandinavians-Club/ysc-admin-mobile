name: Release build

# Pushing a release tag (e.g. `v1.2.0`) to any branch — in practice always
# cut from `main` — builds internal-distribution iOS/Android binaries against
# the prod backend (see eas.json's `production` profile) so the team can
# install them without an app store. The finished builds' install links are
# published to the tag's GitHub Release rather than left in the Actions log.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build ${{ matrix.platform }} (production profile, internal distribution)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --non-interactive \
            --message "$TAG" \
            --json > build.json

      - name: Record build link
        run: |
          id=$(jq -r '.[0].id' build.json)
          owner=$(jq -r '.expo.owner' app.json)
          slug=$(jq -r '.expo.slug' app.json)
          echo "- **${{ matrix.platform }}**: https://expo.dev/accounts/$owner/projects/$slug/builds/$id" \
            > link-${{ matrix.platform }}.md

      - uses: actions/upload-artifact@v4
        with:
          name: build-link-${{ matrix.platform }}
          path: link-${{ matrix.platform }}.md

  publish:
    name: Publish release notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-link-*
          path: links
          merge-multiple: true

      - name: Create/update the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes="Install links:

          $(cat links/*.md)"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" --repo "$REPOSITORY" \
              --title "$TAG" --notes "$notes"
          fi
