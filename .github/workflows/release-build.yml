name: Release build

# Pushing a release tag (e.g. `v1.2.0`) to any branch — in practice always
# cut from `main` — builds iOS/Android binaries against the prod backend (see
# eas.json's `production` profile):
#   - iOS: an App Store build, auto-submitted to TestFlight (`eas submit`).
#   - Android: an internal-distribution `.apk` the team installs from a link.
# The iOS TestFlight status and the Android install link are published to the
# tag's GitHub Release rather than left in the Actions log.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build ${{ matrix.platform }} (production profile)
        env:
          TAG: ${{ github.ref_name }}
          # iOS is an App Store build pushed to TestFlight; --auto-submit runs
          # `eas submit` with the `production` submit profile once the build is
          # done. Android stays an internal-distribution install link.
          AUTO_SUBMIT: ${{ matrix.platform == 'ios' && '--auto-submit' || '' }}
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --non-interactive \
            --message "$TAG" \
            $AUTO_SUBMIT \
            --json > build.json

      - name: Record build link
        run: |
          id=$(jq -r '.[0].id' build.json)
          owner=$(jq -r '.expo.owner' app.json)
          slug=$(jq -r '.expo.slug' app.json)
          url="https://expo.dev/accounts/$owner/projects/$slug/builds/$id"
          if [ "${{ matrix.platform }}" = "ios" ]; then
            echo "- **ios**: submitted to TestFlight — [build details]($url)" > link-ios.md
          else
            echo "- **android**: [install link]($url)" > link-android.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-link-${{ matrix.platform }}
          path: link-${{ matrix.platform }}.md

  publish:
    name: Publish release notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-link-*
          path: links
          merge-multiple: true

      - name: Create/update the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          notes="Builds:

          $(cat links/*.md)"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" --repo "$REPOSITORY" \
              --title "$TAG" --notes "$notes"
          fi
